# Render.com Blueprint — ODİ sosyal sunucusu (ücretsiz web servisi)
# Not: ücretsiz planda disk kalıcı değildir; her yeniden başlatma/dağıtımda sqlite dosyası sıfırlanır.
# Kalıcılık için ücretli plana kalıcı disk ekleyin (ODI_DB'yi diskin yoluna verin) ya da ileride Postgres'e geçin.
services:
  - type: web
    name: odi-sunucu
    runtime: docker
    plan: free
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    healthCheckPath: /saglik
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ODI_DB
        value: /app/data/odi.sqlite
      # Gerçek mağaza makbuz doğrulaması için (yoksa App Store / Play satın alımları reddedilir)
      - key: REVENUECAT_API_KEY
        sync: false
      # Yönetici kodunun tuzlu özeti (npm run kod -- ozet). Verilmezse üretimde yönetici kodu kapalıdır;
      # depodaki varsayılan özet herkese açık olduğu için üretimde kullanılmaz.
      - key: ODI_ADMIN_CODE_HASH
        sync: false
      # Render'ın vekili X-Forwarded-For'a istemci IP'sini sağdan ekler: kod denemesi IP sınırı bu girdiyi kullanır
      - key: ODI_TRUST_PROXY
        value: "1"
      # Yalnızca test dağıtımlarında: "1" yapılırsa web'deki TEST mağazası açılır (para çekmez)
      - key: ODI_TEST_STORE
        value: "0"
