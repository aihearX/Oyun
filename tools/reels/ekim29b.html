<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas><script>
/* 29 Ekim — "Bir odyoloğun kulağından" (ekim29b.mjs çizer). Tek tuval; window.draw(t) her kareyi baştan çizer (rastgelelik tohumlu).
   Bayrak: resmî oranlı SVG olduğu gibi (geometri/renk değişmez, üstüne hiçbir şey konmaz); yalnız bütün olarak ölçeklenir. */
const W = 1080, H = 1920, FONT = '"Inter Display","Inter",sans-serif';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let T = null, FLAG = null, ODI = null, GRAIN = [];
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const ss = (t, a, b) => { const x = lin(t, a, b); return x * x * (3 - 2 * x); };
const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
const eio = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const win = (t, a, b, fi = 0.7, fo = 0.45) => Math.min(ss(t, a, a + fi), 1 - ss(t, b - fo, b));
const mixc = (c1, c2, k) => c1.map((v, i) => Math.round(v + (c2[i] - v) * k));
function rnd(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

async function svgCanvas(svg, w, h) {
  const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); await img.decode();
  const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); return c;
}
function makeGrain() {
  const r = rnd(29);
  for (let k = 0; k < 4; k++) {
    const c = document.createElement('canvas'); c.width = 540; c.height = 960; const g = c.getContext('2d'); const im = g.createImageData(540, 960);
    for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() - 0.5) * 120; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    g.putImageData(im, 0, 0); GRAIN.push(c);
  }
}
window.init = async (o) => {
  T = o.T; FLAG = await svgCanvas(o.flag, 1800, 1200); ODI = await svgCanvas(o.odi, 360, 360);
  for (const w of [500, 600, 700, 800, 900]) await document.fonts.load(`${w} 80px "Inter Display"`);
  makeGrain(); return true;
};

/* ------------------------------------------------------------------ yazı */
function text(lines, o) {
  const alpha = o.alpha ?? 1; if (alpha <= 0.004) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  if ((o.blur ?? 0) > 0.3) ctx.filter = `blur(${o.blur.toFixed(2)}px)`;
  const n = lines.length; let yy = o.y;
  const L = lines.map((ln) => (typeof ln === 'string' ? { t: ln } : ln));
  const sizes = L.map((l) => l.size ?? o.size ?? 72); const lh = o.lh ?? 1.2;
  const total = sizes.reduce((a, s, i) => a + (i ? s * lh : 0), 0); yy = o.y - total / 2 + (o.rise ?? 0);
  L.forEach((l, i) => {
    if (i) yy += sizes[i] * lh * 0.5 + sizes[i - 1] * lh * 0.5;
    const la = l.alpha ?? 1; if (la <= 0.004) return;
    const segs = l.segs ?? [[l.t, l.color ?? o.color ?? '#f6f3ee']];
    const size = sizes[i], weight = l.weight ?? o.weight ?? 700, ls = l.ls ?? o.ls ?? 0;
    ctx.font = `${weight} ${size}px ${FONT}`; ctx.letterSpacing = ls + 'px';
    const ws = segs.map(([s]) => ctx.measureText(s).width); const tw = ws.reduce((a, b) => a + b, 0) - ls;
    let x = (o.x ?? W / 2) - tw / 2; const y = yy + (l.dy ?? 0);
    ctx.globalAlpha = alpha * la;
    segs.forEach(([s, col], k) => {
      if (o.shadow !== false) { ctx.shadowColor = o.shadowColor ?? 'rgba(0,0,0,.55)'; ctx.shadowBlur = o.shadowBlur ?? 26; ctx.shadowOffsetY = o.shadowY ?? 4; }
      ctx.fillStyle = col; ctx.fillText(s, x, y);
      if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowBlur ?? 30; ctx.shadowOffsetY = 0; ctx.globalAlpha = alpha * la * 0.5; ctx.fillText(s, x, y); ctx.globalAlpha = alpha * la; }
      x += ws[k];
    });
  });
  ctx.restore();
}
/** zamanlı yazı: bulanıklıktan netleşerek yükselir, yumuşak söner */
function beat(t, b) {
  if (t < b.a - 0.05 || t > b.b + 0.05) return;
  const a = win(t, b.a, b.b, b.fi ?? 0.8, b.fo ?? 0.45);
  const rise = (1 - eo(lin(t, b.a, b.a + 1.1))) * 26 - ss(t, b.b - 0.45, b.b) * 10;
  const blur = (1 - ss(t, b.a, b.a + 0.75)) * 12 + ss(t, b.b - 0.45, b.b) * 7;
  const lines = b.lines.map((l) => {
    if (typeof l === 'string' || l.at == null) return l;
    return { ...l, alpha: ss(t, b.a + l.at, b.a + l.at + 0.6), dy: (1 - eo(lin(t, b.a + l.at, b.a + l.at + 0.9))) * 20 };
  });
  text(lines, { ...b, alpha: a, rise, blur });
}

/* ------------------------------------------------------------------ odyogram */
const AX0 = 150, AX1 = 930, AY0 = 900, AY1 = 1460;
const fX = (f) => AX0 + Math.log2(f / 250) * (AX1 - AX0) / 5;
const dbY = (db) => AY0 + (db + 10) / 130 * (AY1 - AY0);
const WY = dbY(40);
function grid(a) {
  if (a <= 0.004) return;
  ctx.save(); ctx.lineWidth = 1.5;
  for (let i = 0; i <= 5; i++) { const x = AX0 + i * (AX1 - AX0) / 5; ctx.strokeStyle = `rgba(150,172,215,${0.2 * a})`; ctx.beginPath(); ctx.moveTo(x, AY0); ctx.lineTo(x, AY1); ctx.stroke(); }
  for (let db = -10; db <= 120; db += 10) { const y = dbY(db); ctx.strokeStyle = `rgba(150,172,215,${(db === 0 ? 0.32 : 0.16) * a})`; ctx.beginPath(); ctx.moveTo(AX0, y); ctx.lineTo(AX1, y); ctx.stroke(); }
  ctx.fillStyle = `rgba(175,192,228,${0.5 * a})`; ctx.font = `600 24px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ['250', '500', '1k', '2k', '4k', '8k'].forEach((s, i) => ctx.fillText(s, AX0 + i * (AX1 - AX0) / 5, AY0 - 30));
  ctx.font = `600 20px ${FONT}`; ctx.textAlign = 'right';
  for (let db = 0; db <= 120; db += 20) ctx.fillText(String(db), AX0 - 16, dbY(db));
  ctx.fillText('dB HL', AX0 - 16, AY0 - 66); ctx.textAlign = 'left'; ctx.fillText('Hz', AX1 + 16, AY0 - 30);
  ctx.restore();
}
// yanıt yok (NR): sağ O kırmızı, sol X mavi, odyometre üst sınırında aşağı oklar
const NR = [[250, 105], [500, 115], [1000, 120], [2000, 120], [4000, 115], [8000, 100]];
function nr(a) {
  if (a <= 0.004) return;
  ctx.save(); ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  for (const [f, db] of NR) {
    const x = fX(f), y = dbY(db);
    ctx.strokeStyle = `rgba(236,78,88,${a})`; ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.stroke();
    arrow(x - 9, y + 9, x - 24, y + 26);
    ctx.strokeStyle = `rgba(80,140,240,${a})`; ctx.beginPath(); ctx.moveTo(x - 11, y - 11); ctx.lineTo(x + 11, y + 11); ctx.moveTo(x + 11, y - 11); ctx.lineTo(x - 11, y + 11); ctx.stroke();
    arrow(x + 9, y + 9, x + 24, y + 26);
  }
  ctx.restore();
}
function arrow(x0, y0, x1, y1) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); const an = Math.atan2(y1 - y0, x1 - x0);
  ctx.lineTo(x1 - 9 * Math.cos(an - 0.5), y1 - 9 * Math.sin(an - 0.5)); ctx.moveTo(x1, y1); ctx.lineTo(x1 - 9 * Math.cos(an + 0.5), y1 - 9 * Math.sin(an + 0.5)); ctx.stroke();
}
// konuşma muzu (speech banana)
const BAN = [[250, 30], [500, 22], [1000, 20], [2000, 22], [4000, 25], [6000, 32], [6000, 40], [4000, 50], [2000, 56], [1000, 58], [500, 58], [250, 52]].map(([f, d]) => [fX(f), dbY(d)]);
function bananaPath() {
  const p = BAN, n = p.length; ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const p0 = p[(i - 1 + n) % n], p1 = p[i], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n];
    if (i === 0) ctx.moveTo(p1[0], p1[1]);
    ctx.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
  ctx.closePath();
}
function banana(stroke, fill) {
  if (stroke + fill <= 0.004) return;
  ctx.save(); bananaPath();
  if (fill > 0) { const g = ctx.createLinearGradient(AX0, 0, AX1, 0); g.addColorStop(0, `rgba(255,190,90,${fill})`); g.addColorStop(0.5, `rgba(255,232,170,${fill})`); g.addColorStop(1, `rgba(255,120,90,${fill})`); ctx.fillStyle = g; ctx.shadowColor = `rgba(255,190,90,${fill})`; ctx.shadowBlur = 50; ctx.fill(); }
  ctx.shadowBlur = 0; ctx.setLineDash([10, 9]); ctx.lineWidth = 2.4; ctx.strokeStyle = `rgba(255,214,140,${stroke})`; ctx.stroke();
  ctx.restore();
}

/* ------------------------------------------------------------------ dalga */
const MX = 255, BX = 825; // anne, bebek
function bloomAmp(t) {
  const k = t - T.click; if (k < 0) return 0;
  return 64 * eo(k / 0.35) - 12 * ss(k, 0.35, 1.4) + 105 * ss(t, T.b5.a, T.cut - 0.1);
}
function waveY(x, t, strand) {
  const jit = 1 - 0.8 * ss(t, T.b4.a, T.b4.a + 0.6) + 0.8 * ss(t, T.click - 0.01, T.click + 0.2);
  let y = (Math.sin(x * 0.09 + t * 7 + strand) * 0.9 + Math.sin(x * 0.23 - t * 11) * 0.6) * jit;
  for (const p of T.packets) {
    const u = (t - p.t0) / p.dur; if (u < 0 || u > 1.6) continue;
    const cx = p.x0 + (p.x1 - p.x0) * eio(Math.min(u, 1)); const fade = 1 - ss(u, 0.9, 1.25);
    const g = Math.exp(-(((x - cx) / 70) ** 2)); y += p.amp * g * fade * Math.sin((x - cx) * 0.17 - t * 6 + strand * 0.6) * (strand ? 0.55 : 1);
  }
  const A = bloomAmp(t);
  if (A > 0) {
    const k = t - T.click, R = 60 + eo(k / 1.5) * 760, d = Math.abs(x - 540), sp = 1 - ss(d, R - 160, R);
    const ph = strand * 1.7, sp2 = 1 + strand * 0.18;
    const carrier = 0.62 * Math.sin(x * 0.045 * sp2 - t * 5.2 + ph) + 0.3 * Math.sin(x * 0.11 + t * 3.1 - ph) + 0.08 * Math.sin(x * 0.19 * sp2 - t * 9.3);
    const syll = 0.62 + 0.38 * Math.sin(x * 0.0125 - t * 2.4 + ph * 0.5);
    y += A * sp * carrier * syll * [1, 0.7, 0.46][strand] * (0.55 + 0.45 * Math.cos((x - 540) / 540 * 1.3));
  }
  return y;
}
function wave(t) {
  const lineA = ss(t, 0.15, 1.4);
  const bl = ss(t, T.click, T.click + 0.6);
  const strands = bl > 0 ? 3 : 1;
  ctx.save();
  for (let s = strands - 1; s >= 0; s--) {
    ctx.beginPath();
    for (let x = -10; x <= W + 10; x += 4) { const y = WY + waveY(x, t, s); x < 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    const pre = [150, 172, 215], gold = [[255, 246, 226], [255, 196, 92], [255, 84, 72]][s];
    const warm = ss(t, T.b5.a + 1.0, T.cut);
    const col = s === 0 ? mixc(mixc(pre, gold, bl), [255, 255, 255], warm * 0.6) : mixc(gold, [255, 60, 60], warm * 0.5);
    const a = s === 0 ? (0.5 + 0.5 * bl) * lineA : bl * 0.85;
    ctx.globalCompositeOperation = bl > 0 ? 'lighter' : 'source-over';
    ctx.strokeStyle = `rgba(${col},${a})`; ctx.lineWidth = s === 0 ? 2.6 + 2.4 * bl : 2.2; ctx.lineJoin = 'round';
    ctx.shadowColor = `rgba(${s === 0 ? mixc([120, 150, 220], [255, 200, 120], bl) : gold},${0.9 * (0.4 + bl * 0.6)})`; ctx.shadowBlur = 10 + 26 * bl + 20 * warm;
    ctx.stroke();
  }
  ctx.restore();
}
function orb(x, y, r, a, col, glow) {
  if (a <= 0.004) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * (3.2 + glow * 2));
  g.addColorStop(0, `rgba(${col},${0.55 * a})`); g.addColorStop(0.35, `rgba(${col},${0.18 * a * (1 + glow)})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * (3.2 + glow * 2), 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  const g2 = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y, r);
  g2.addColorStop(0, `rgba(255,255,255,${a})`); g2.addColorStop(1, `rgba(${col},${a})`);
  ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function ring(x, y, r, a, lw, col = '255,236,205') {
  if (a <= 0.004 || r <= 0) return;
  ctx.save(); ctx.strokeStyle = `rgba(${col},${a})`; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}
function motherBaby(t) {
  const am = win(t, T.mother, T.b4.a + 0.3, 0.8, 0.7), ab = win(t, T.mother + 0.35, T.b4.a + 0.3, 0.8, 0.7);
  if (am + ab <= 0) return;
  // anne: sıcak, büyük; sesini halkalarla yayar
  for (let k = 0; k < 4; k++) { const te = T.packets[0].t0 - 0.15 + k * 0.85; const u = t - te; if (u > 0 && u < 1.8) ring(MX, WY, 34 + u * 120, 0.32 * (1 - u / 1.8) * am, 2.2, '255,214,165'); }
  orb(MX, WY, 30, am, '255,196,140', 0.2 + 0.25 * Math.sin(t * 2.2) ** 2);
  // bebek: ses ulaşınca parlar ve sese döner (iç parıltı anneye doğru kayar)
  let hear = 0;
  for (const p of T.packets) { const u = t - (p.t0 + p.dur); hear = Math.max(hear, u > 0 ? Math.exp(-u * 1.1) : 0); if (u > 0 && u < 1.4) ring(BX, WY, 20 + u * 150, 0.6 * (1 - u / 1.4) * ab, 2.6, '255,240,210'); }
  const turned = ss(t, T.packets[0].t0 + T.packets[0].dur, T.packets[0].t0 + T.packets[0].dur + 0.6);
  orb(BX, WY, 17, ab * (0.65 + 0.35 * hear), '255,232,196', hear * 1.4);
  if (ab > 0) { ctx.save(); ctx.globalAlpha = ab * (0.5 + 0.5 * turned); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(BX - 6 * turned, WY - 3, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
}
function sparks(t, a) {
  if (a <= 0.004) return;
  const r = rnd(7); ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 70; i++) {
    const x0 = r() * W, sp = 60 + r() * 160, ph = r() * 6, born = T.click + r() * (T.cut - T.click);
    const u = t - born; if (u < 0) continue; const life = 2.2 + r() * 1.5; const k = (u % life) / life;
    const x = x0 + Math.sin(ph + u * 1.3) * 20, y = WY - k * sp * 3.2 + (r() - 0.5) * 60;
    const s = 1.2 + r() * 2.6; ctx.fillStyle = `rgba(255,${200 + Math.floor(r() * 50)},${120 + Math.floor(r() * 80)},${a * (1 - k) * 0.85})`;
    ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function vignette(a = 0.75) {
  const g = ctx.createRadialGradient(W / 2, H * 0.48, H * 0.25, W / 2, H * 0.5, H * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function grain(t, a) {
  ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(GRAIN[Math.floor(t * 30) % GRAIN.length], 0, 0, W, H); ctx.restore();
}

function drawPre(t) {
  ctx.fillStyle = '#030409'; ctx.fillRect(0, 0, W, H);
  if (t >= T.cut) return;
  // ortam ışığı: soğuk karanlık → klikte sıcak → bayrağa doğru kızıl
  const bl = ss(t, T.click, T.click + 1.2), warm = ss(t, T.b5.a, T.cut);
  const col = mixc(mixc([30, 50, 95], [255, 170, 80], bl), [220, 40, 40], warm);
  const ia = 0.16 + 0.05 * Math.sin(t * 1.3) ** 2 - 0.1 * ss(t, T.b4.a, T.b4.a + 0.6) * (1 - bl) + 0.22 * bl + 0.32 * warm;
  const g = ctx.createRadialGradient(540, WY, 20, 540, WY, 1000); g.addColorStop(0, `rgba(${col},${ia})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const out = 1 - ss(t, T.cut - 0.5, T.cut - 0.05);
  const gA = ss(t, 0.3, 2.4) * (1 - 0.45 * win(t, T.mother, T.b4.a + 0.3)) * (1 - 0.4 * warm) * out;
  grid(gA);
  banana(0.22 * ss(t, 1.2, 3.0) * out + 0.25 * bl * out, (0.16 * bl + 0.16 * warm) * out);
  nr(0.75 * ss(t, 1.4, 3.2) * (1 - 0.6 * bl) * out);
  ctx.save(); ctx.globalAlpha = out; wave(t); motherBaby(t); ctx.restore();
  // klik: tek nokta, halka, kısa parlama
  const k = t - T.click;
  if (k >= 0 && k < 1.6) {
    ring(540, WY, 10 + eo(k / 1.2) * 520, 0.85 * (1 - lin(k, 0, 1.2)), 4);
    ring(540, WY, 10 + eo(k / 1.5) * 300, 0.5 * (1 - lin(k, 0, 1.5)), 2);
    orb(540, WY, 9, 1 - lin(k, 0.1, 1.2), '255,240,210', 1.5);
    ctx.fillStyle = `rgba(255,236,200,${0.16 * (1 - lin(k, 0, 0.3))})`; ctx.fillRect(0, 0, W, H);
  }
  sparks(t, ss(t, T.click + 0.3, T.click + 1.5) * (0.6 + 0.4 * warm) * out);
  for (const b of T.pre) beat(t, b);
  vignette(0.8);
}

/* ------------------------------------------------------------------ bayrak bölümü */
function flagRect(t) {
  const e = eio(lin(t, T.end, T.end + 1.1));
  const w0 = 820 * (1 + 0.09 * (1 - eo(lin(t, T.flag, T.flag + 1.6)))), top0 = 300 + 273 - 273 * (w0 / 820);
  const w = w0 + (600 - w0) * e, top = top0 + (282 - top0) * e;
  return { x: 540 - w / 2, y: top, w, h: w * 2 / 3 };
}
function drawRed(t, fr, period, t0) {
  const cy = fr.y + fr.h / 2;
  const g = ctx.createRadialGradient(540, cy, 40, 540, cy + 250, 1500);
  g.addColorStop(0, '#d01c2c'); g.addColorStop(0.42, '#930c19'); g.addColorStop(1, '#2a0307');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // sabit ince halkalar (ilk Reels'in dili)
  for (let i = 0; i < 8; i++) ring(540, cy, 300 + i * 110, 0.07 * (1 - i / 9), 3, '255,255,255');
  // yayılan ses halkaları: her yarım ölçüde bir
  for (let k = 0; k < 40; k++) {
    const te = t0 + k * period, u = t - te; if (u < 0) break; if (u > 3.6) continue;
    const first = k === 0;
    ring(540, cy, 330 + u * (first ? 820 : 430), (first ? 0.75 : 0.3) * (1 - u / 3.6) ** 1.4, first ? 12 * (1 - u / 3.6) + 2 : 3.5, first ? '255,240,215' : '255,226,200');
  }
  // bayrağın ardındaki ışık
  const pulse = 0.5 + 0.5 * Math.cos(((t - t0) / period) * Math.PI * 2);
  const gl = ctx.createRadialGradient(540, cy, fr.w * 0.25, 540, cy, fr.w * 1.05);
  gl.addColorStop(0, `rgba(255,226,190,${0.38 + 0.08 * pulse})`); gl.addColorStop(1, 'rgba(255,200,160,0)');
  ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
}
function dust(t, a) {
  const r = rnd(1923); ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 80; i++) {
    const x0 = r() * W, y0 = r() * H, v = 14 + r() * 40, s = 1 + r() * 2.8, ph = r() * 6.28, al = 0.25 + r() * 0.5;
    const y = ((y0 - t * v) % H + H) % H, x = x0 + Math.sin(t * 0.6 + ph) * 18;
    ctx.fillStyle = `rgba(255,225,170,${a * al * (0.6 + 0.4 * Math.sin(t * 2 + ph))})`; ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function drawFlag(fr) {
  ctx.save(); ctx.shadowColor = 'rgba(40,0,6,.6)'; ctx.shadowBlur = 70; ctx.shadowOffsetY = 26;
  ctx.drawImage(FLAG, fr.x, fr.y, fr.w, fr.h); ctx.restore();
}
function miniWave(t, cx, cy, w, a, amp = 18) {
  if (a <= 0.004) return;
  ctx.save(); ctx.globalAlpha = a; ctx.beginPath();
  for (let x = -w / 2; x <= w / 2; x += 3) {
    const e = Math.cos((x / (w / 2)) * Math.PI / 2) ** 2;
    const y = cy + amp * e * (0.65 * Math.sin(x * 0.09 - t * 5) + 0.35 * Math.sin(x * 0.21 + t * 3));
    x === -w / 2 ? ctx.moveTo(cx + x, y) : ctx.lineTo(cx + x, y);
  }
  ctx.strokeStyle = '#ffe3a3'; ctx.lineWidth = 3; ctx.shadowColor = 'rgba(255,220,150,.8)'; ctx.shadowBlur = 12; ctx.stroke(); ctx.restore();
}
function odiSign(cx, cy, a) {
  if (a <= 0.004) return;
  ctx.save(); ctx.globalAlpha = a;
  const s = 92; const gw = s + 14 + 150; const x0 = cx - gw / 2;
  ctx.drawImage(ODI, x0, cy - s / 2, s, s);
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.font = `900 38px ${FONT}`; ctx.letterSpacing = '2px'; ctx.fillText('ODİ', x0 + s + 14, cy - 12);
  ctx.font = `700 16px ${FONT}`; ctx.letterSpacing = '6px'; ctx.fillStyle = '#ffe9ea'; ctx.fillText('SESİN YOLU', x0 + s + 15, cy + 20);
  ctx.restore();
}
function pill(t, cx, cy, a, label) {
  if (a <= 0.004) return;
  ctx.save(); ctx.globalAlpha = a; ctx.font = `800 42px ${FONT}`; ctx.letterSpacing = '0px';
  const tw = ctx.measureText(label).width, iw = 42, gap = 20, w = tw + iw + gap + 92, h = 100, x = cx - w / 2, y = cy - h / 2;
  const sc = 1 + 0.018 * Math.sin(t * 3.4) ** 2; ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
  ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.shadowColor = 'rgba(40,0,6,.45)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10; ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  // kâğıt uçak
  const ix = x + 42, iy = cy; ctx.fillStyle = '#c8102e'; ctx.beginPath(); ctx.moveTo(ix, iy - 2); ctx.lineTo(ix + iw, iy - 17); ctx.lineTo(ix + iw - 12, iy + 17); ctx.lineTo(ix + 17, iy + 5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8e0a1c'; ctx.beginPath(); ctx.moveTo(ix + 17, iy + 5); ctx.lineTo(ix + iw, iy - 17); ctx.lineTo(ix + 15, iy + 16); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#9c0c1e'; ctx.textBaseline = 'middle'; ctx.fillText(label, ix + iw + gap, cy + 2);
  ctx.restore();
}
function drawPost(t) {
  const fr = flagRect(t);
  drawRed(t, fr, T.period, T.flag);
  dust(t, ss(t, T.flag, T.flag + 1.5) * 0.8);
  drawFlag(fr);
  for (const b of T.post) beat(t, b);
  // bitiş kartı (hikâye karesi olarak da durur)
  const E = T.end, ap = (d) => ss(t, E + d, E + d + 0.7), dy = (d) => (1 - eo(lin(t, E + d, E + d + 0.9))) * 22;
  if (t >= E) {
    text([{ t: '29 EKİM 1923  ·  2026', size: 30, weight: 800, ls: 9, color: '#ffe3a3' }], { y: 776 + dy(0.45), alpha: ap(0.45), shadowBlur: 14 });
    text([{ segs: [['Cumhuriyetimizin ', '#fff'], ['103. yılı', '#ffe3a3']], size: 66, weight: 900 }, { t: 'kutlu olsun!', size: 66, weight: 900, color: '#fff' }], { y: 900 + dy(0.6), alpha: ap(0.6), lh: 1.16 });
    miniWave(t, 540, 1036, 360, ap(0.95));
    text([{ t: "Türkiye'nin tüm odyologlarına", size: 54, weight: 800 }, { t: 've odyoloji öğrencilerine', size: 54, weight: 800 }], { y: 1158 + dy(1.2), alpha: ap(1.2), color: '#ffeef0', lh: 1.28 });
    pill(t, 540, 1330 + dy(1.85), ap(1.85), 'Bir meslektaşına gönder');
    odiSign(540, 1482, 0.9 * ap(2.3));
  }
  vignette(0.55);
  const fl = 1 - eo(lin(t, T.flag, T.flag + 0.7));
  if (fl > 0.003) { ctx.fillStyle = `rgba(255,248,236,${0.92 * fl})`; ctx.fillRect(0, 0, W, H); }
}

/* ------------------------------------------------------------------ kapak */
function drawCover() {
  const fr = { x: 130, y: 330, w: 820, h: 820 * 2 / 3 };
  drawRed(T.flag + 9.3, fr, T.period, T.flag);
  dust(4, 0.7); drawFlag(fr);
  text([{ t: '29 EKİM 1923', size: 36, weight: 800, ls: 12, color: '#ffe3a3' }], { y: 975, shadowBlur: 14 });
  text([{ t: 'Bir milletin,', size: 92 }, { segs: [['kendi sesini', '#ffe3a3']], size: 92 }, { t: 'duyduğu gün.', size: 92 }], { y: 1175, weight: 900, color: '#fff', lh: 1.1 });
  miniWave(2.2, 540, 1365, 360, 1, 20);
  text([{ t: 'Bir odyoloğun kulağından', size: 40, weight: 600, color: '#ffeef0' }], { y: 1450 });
  vignette(0.5);
}

window.draw = (t, mode) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.letterSpacing = '0px';
  if (mode === 'cover') { drawCover(); grain(0, 0.05); return; }
  if (t < T.flag) drawPre(t); else drawPost(t);
  if (!(t >= T.cut && t < T.flag)) grain(t, t < T.flag ? 0.07 : 0.045);
};
window.snap = (q = 0.93) => cv.toDataURL('image/jpeg', q);
window.snapPng = () => cv.toDataURL('image/png');
