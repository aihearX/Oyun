<!doctype html>
<html lang="tr" style="zoom:2">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=540, initial-scale=1" />
<title>ODİ Reels Stüdyosu</title>
<style>
  :root { --accent:#6c4cf1; --coral:#f0567a; --text:#13162a; --muted:#5d6378; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:540px; height:960px; overflow:hidden; font-family:"Inter","SF Pro Rounded","Segoe UI",Arial,sans-serif; color:var(--text); }
  body { background:radial-gradient(120% 80% at 50% 0%, #efe9ff 0%, #ffffff 55%, #ffe8ef 100%); }
  #stage { position:absolute; left:30px; top:0; width:480px; height:960px; overflow:hidden; border-radius:0; background:#000; }
  #stage iframe { width:480px; height:960px; border:0; display:block; }
  #slides { position:absolute; inset:0; display:none; align-items:center; justify-content:center; }
  .phone { position:absolute; width:400px; height:797px; top:150px; left:70px; border-radius:46px; background:#13162a; padding:12px; box-shadow:0 30px 80px rgba(60,40,140,.35); }
  .phone .screen { width:100%; height:100%; border-radius:36px; overflow:hidden; position:relative; background:#fff; }
  .phone img { position:absolute; inset:0; width:100%; height:auto; opacity:0; transition:opacity .35s ease, transform 2.2s ease-out; transform:scale(1.04); }
  .phone img.on { opacity:1; transform:scale(1); }
  /* yazılar */
  .cap { position:absolute; left:50%; transform:translate(-50%, 0) scale(.6); opacity:0; transition:opacity .22s ease, transform .35s cubic-bezier(.2,1.6,.4,1); text-align:center; z-index:20; pointer-events:none; }
  .cap.on { opacity:1; transform:translate(-50%, 0) scale(1); }
  .cap.top { top:108px; width:470px; font-size:33px; line-height:1.15; font-weight:900; letter-spacing:-.5px; color:#fff; background:linear-gradient(135deg, #6c4cf1, #9b5cf6); padding:16px 20px 18px; border-radius:26px; box-shadow:0 14px 36px rgba(108,76,241,.45); }
  body.slides .cap.top { top:26px; }
  .cap.top.coral { background:linear-gradient(135deg, #f0567a, #ff8a5c); box-shadow:0 14px 36px rgba(240,86,122,.45); }
  .cap.bottom { bottom:54px; width:460px; font-size:27px; line-height:1.2; font-weight:800; background:rgba(255,255,255,.97); padding:16px 18px; border-radius:22px; box-shadow:0 12px 30px rgba(19,22,42,.28); border:3px solid #6c4cf1; }
  .cap.bottom b { color:var(--coral); }
  /* parmak */
  #touch { position:absolute; inset:0; z-index:15; pointer-events:none; }
  .ripple { position:absolute; width:90px; height:90px; margin:-45px 0 0 -45px; border-radius:50%; border:6px solid rgba(255,255,255,.95); background:rgba(108,76,241,.35); box-shadow:0 0 0 4px rgba(108,76,241,.5); animation:rip .5s ease-out forwards; }
  @keyframes rip { from { transform:scale(.4); opacity:1; } to { transform:scale(1.5); opacity:0; } }
  .hold { position:absolute; left:-200px; top:-200px; width:96px; height:96px; margin:-48px 0 0 -48px; border-radius:50%; background:rgba(108,76,241,.45); border:6px solid #fff; box-shadow:0 0 0 6px rgba(108,76,241,.4); display:none; }
  .hold.on { display:block; animation:pulse .6s ease-in-out infinite alternate; }
  @keyframes pulse { from { transform:scale(.92); } to { transform:scale(1.06); } }
  .swipe { position:absolute; font-size:64px; margin:-40px 0 0 -32px; animation:sw .55s ease-in forwards; filter:drop-shadow(0 4px 8px rgba(0,0,0,.35)); }
  @keyframes sw { from { transform:translateY(-30px); opacity:1; } to { transform:translateY(60px); opacity:0; } }
  .finger { position:absolute; font-size:58px; margin:-20px 0 0 -10px; filter:drop-shadow(0 4px 8px rgba(0,0,0,.35)); transition:opacity .2s; }
  /* kartlar */
  #card { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center; padding:40px; z-index:30;
    background:radial-gradient(120% 90% at 50% 10%, #8a6bff 0%, #6c4cf1 45%, #3d2a9e 100%); color:#fff; }
  #card .logo { width:210px; height:210px; animation:bob 1.6s ease-in-out infinite alternate; }
  @keyframes bob { from { transform:translateY(-6px) rotate(-3deg); } to { transform:translateY(8px) rotate(3deg); } }
  #card h1 { font-size:76px; font-weight:900; letter-spacing:-2px; line-height:1; }
  #card h1 span { color:#ffd166; }
  #card .sub { font-size:30px; font-weight:800; opacity:.95; }
  #card .line { font-size:34px; font-weight:900; background:#fff; color:var(--accent); padding:12px 24px; border-radius:999px; }
  #card .small { font-size:22px; font-weight:700; opacity:.85; }
  .in { animation:inn .5s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes inn { from { transform:scale(.5); opacity:0; } to { transform:none; opacity:1; } }
</style>
</head>
<body>
<div id="stage"><iframe id="game" allow="autoplay"></iframe></div>
<div id="slides"><div class="phone"><div class="screen" id="screen"></div></div></div>
<div id="touch"><div class="hold" id="hold"></div></div>
<div id="capTop" class="cap top"></div>
<div id="capBottom" class="cap bottom"></div>
<div id="card"></div>
<script>
const ODI = '<svg class="logo" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#fff"/><circle cx="32" cy="32" r="26" fill="#6c4cf1"/><circle cx="24" cy="28" r="5" fill="#fff"/><circle cx="40" cy="28" r="5" fill="#fff"/><circle cx="25" cy="29" r="2.5" fill="#13162a"/><circle cx="41" cy="29" r="2.5" fill="#13162a"/><path d="M22 40q10 10 20 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>';
const $ = (id) => document.getElementById(id);
window.studio = { readyAt: 0, error: null };

function caption(el, html, cls) {
  el.className = 'cap ' + (el.id === 'capTop' ? 'top' : 'bottom') + (cls ? ' ' + cls : '');
  el.innerHTML = html; void el.offsetWidth; el.classList.add('on');
}
function hide(el) { el.classList.remove('on'); }
function schedule(caps) {
  for (const c of caps) {
    setTimeout(() => caption(c.pos === 'top' ? $('capTop') : $('capBottom'), c.text, c.cls), c.at);
    if (c.until) setTimeout(() => hide(c.pos === 'top' ? $('capTop') : $('capBottom')), c.until);
  }
}

// parmak göstergeleri: oyun içindeki girişi kare kare okur (bot ya da insan fark etmez)
function wireTouch(win) {
  const sc = win.__odiScene; if (!sc) return false;
  const inp = sc.input_;
  // yakınlaştırılmış belgede getBoundingClientRect ölçeklenmiş döner; sahne sabit: sol 30, genişlik 480 (CSS px)
  const stage = { left: 30, width: 480 };
  const posFor = () => {
    const d = inp.virtual && typeof inp.virtual.dir === 'number' ? inp.virtual.dir : 0;
    return { x: stage.left + (d > 0 ? stage.width * 0.78 : d < 0 ? stage.width * 0.22 : stage.width * 0.5), y: 745 };
  };
  const origSwipe = inp.swipeDown.bind(inp);
  inp.swipeDown = () => { const p = posFor(); const s = document.createElement('div'); s.className = 'swipe'; s.textContent = '👇'; s.style.left = p.x + 'px'; s.style.top = p.y + 'px'; $('touch').appendChild(s); setTimeout(() => s.remove(), 600); return origSwipe(); };
  let down = false, downAt = 0;
  const hold = $('hold');
  const loop = () => {
    const now = performance.now();
    const isDown = !!(inp.state.primaryDown || (inp.virtual && inp.virtual.primaryDown));
    if (isDown && !down) { downAt = now; const p = posFor(); const r = document.createElement('div'); r.className = 'ripple'; r.style.left = p.x + 'px'; r.style.top = p.y + 'px'; $('touch').appendChild(r); setTimeout(() => r.remove(), 520); hold.style.left = p.x + 'px'; hold.style.top = p.y + 'px'; }
    if (isDown && now - downAt > 140) hold.classList.add('on'); else hold.classList.remove('on');
    down = isDown;
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  return true;
}

function playLevel(sc) {
  const f = $('game');
  f.src = `/?bot=1&level=${sc.level}${sc.salt ? `&salt=${sc.salt}` : ''}`;
  const poll = setInterval(() => {
    try {
      const w = f.contentWindow;
      if (w && w.__odi && w.__odi.events.some((e) => e.type === 'started') && w.__odiScene) {
        clearInterval(poll);
        wireTouch(w);
        // oyunun kendi alt ipucu yazısını gizle (stüdyo kendi yazısını gösterir)
        try { const s = w.__odiScene; const orig = s.hint.bind(s); s.hint = () => {}; void orig; } catch { /* yok */ }
        window.studio.readyAt = performance.now();
        setTimeout(() => schedule(sc.caps), (sc.skip ?? 0) * 1000);
      }
    } catch (e) { window.studio.error = String(e); }
  }, 30);
}

function playSlides(sc) {
  $('stage').style.display = 'none'; $('slides').style.display = 'flex'; document.body.classList.add('slides');
  const screen = $('screen');
  const imgs = sc.images.map((src) => { const i = new Image(); i.src = src; screen.appendChild(i); return i; });
  Promise.all(imgs.map((i) => (i.decode ? i.decode().catch(() => undefined) : undefined))).then(() => {
    window.studio.readyAt = performance.now();
    sc.images.forEach((_, k) => setTimeout(() => { imgs.forEach((im, j) => im.classList.toggle('on', j === k)); }, k * sc.each));
    schedule(sc.caps);
  });
}

function playCard(sc) {
  $('stage').style.display = 'none';
  const c = $('card'); c.style.display = 'flex'; c.innerHTML = sc.html.replace('{ODI}', ODI);
  [...c.children].forEach((el, i) => { el.classList.add('in'); el.style.animationDelay = (i * 0.18) + 's'; });
  window.studio.readyAt = performance.now();
}

window.startScene = (sc) => { if (sc.type === 'level') playLevel(sc); else if (sc.type === 'slides') playSlides(sc); else playCard(sc); };
</script>
</body>
</html>
