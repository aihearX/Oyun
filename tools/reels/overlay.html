<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>ODİ Reels: yazı ve kart katmanı</title>
<style>
  /* "Kulak Gecesi": koyu mor gece, altın, turkuaz, mercan, krem. Baloo 2 + Nunito (OFL, tools/reels/fonts). */
  @font-face { font-family:'Baloo 2'; font-weight:700; src:url(fonts/baloo-2-latin-700-normal.woff2) format('woff2'); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family:'Baloo 2'; font-weight:700; src:url(fonts/baloo-2-latin-ext-700-normal.woff2) format('woff2'); unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family:'Baloo 2'; font-weight:800; src:url(fonts/baloo-2-latin-800-normal.woff2) format('woff2'); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family:'Baloo 2'; font-weight:800; src:url(fonts/baloo-2-latin-ext-800-normal.woff2) format('woff2'); unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family:'Nunito'; font-weight:800; src:url(fonts/nunito-latin-800-normal.woff2) format('woff2'); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family:'Nunito'; font-weight:800; src:url(fonts/nunito-latin-ext-800-normal.woff2) format('woff2'); unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family:'Nunito'; font-weight:900; src:url(fonts/nunito-latin-900-normal.woff2) format('woff2'); unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family:'Nunito'; font-weight:900; src:url(fonts/nunito-latin-ext-900-normal.woff2) format('woff2'); unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  :root { --bg0:#140c35; --bg1:#1f1452; --bg2:#2d1d6e; --gold:#ffc93c; --gold2:#ff9f1c; --coral:#ff5c8a; --teal:#2ee6d6; --cream:#fff6e5; --lav:#c9c1ff;
    --ui:'Nunito','Baloo 2',sans-serif; --disp:'Baloo 2','Nunito',sans-serif; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; font-family:var(--ui); color:var(--cream); }
  .scene { position:absolute; inset:0; display:none; overflow:hidden; }
  .scene.on { display:block; }
  /* arka planlar (oyun dışı sahneler) */
  .bg-night { position:absolute; inset:0; background:
      radial-gradient(70% 38% at 50% 34%, rgba(255,201,60,.16), rgba(255,201,60,0) 70%),
      radial-gradient(120% 80% at 50% 0%, var(--bg2) 0%, var(--bg1) 45%, var(--bg0) 100%); }
  .stars { position:absolute; inset:-60px; opacity:.8; background-image:
      radial-gradient(2.4px 2.4px at 12% 18%, #fff 50%, transparent 52%), radial-gradient(2px 2px at 78% 12%, #fff 50%, transparent 52%),
      radial-gradient(3px 3px at 36% 64%, #ffe7a8 50%, transparent 52%), radial-gradient(2px 2px at 88% 52%, #fff 50%, transparent 52%),
      radial-gradient(2.6px 2.6px at 22% 86%, #c9fff9 50%, transparent 52%), radial-gradient(2px 2px at 64% 82%, #fff 50%, transparent 52%),
      radial-gradient(2px 2px at 52% 30%, #fff 50%, transparent 52%), radial-gradient(3px 3px at 6% 48%, #fff 50%, transparent 52%),
      radial-gradient(2px 2px at 94% 90%, #ffe7a8 50%, transparent 52%), radial-gradient(2.2px 2.2px at 70% 40%, #c9fff9 50%, transparent 52%);
      background-size:540px 640px; }
  .ring { position:absolute; left:50%; border-radius:50%; border:3px solid rgba(46,230,214,.22); transform:translate(-50%,-50%); }
  /* oyun sahnelerinde yazının okunması için yumuşak koyulaştırma */
  .shade-top { position:absolute; left:0; right:0; top:0; height:900px; background:linear-gradient(180deg, rgba(14,8,40,.78) 0%, rgba(14,8,40,.5) 45%, rgba(14,8,40,0) 100%); }
  .shade-bot { position:absolute; left:0; right:0; bottom:0; height:760px; background:linear-gradient(0deg, rgba(14,8,40,.8) 0%, rgba(14,8,40,.55) 50%, rgba(14,8,40,0) 100%); }
  .flash { position:absolute; inset:0; background:#fff6e5; }

  .el { position:absolute; left:0; right:0; display:flex; justify-content:center; pointer-events:none; will-change:transform,opacity; }
  /* kanca: büyük cam kutu, altın kenar */
  .hook { margin:0 64px; padding:30px 40px 30px; text-align:center; font:800 78px/1.06 var(--disp); letter-spacing:-.5px;
    background:linear-gradient(180deg, rgba(58,39,136,.95), rgba(24,14,66,.95)); border:6px solid var(--gold); border-radius:48px;
    box-shadow:0 18px 50px rgba(5,0,25,.65), inset 0 2px 0 rgba(255,255,255,.18), 0 0 46px rgba(255,201,60,.35); text-shadow:0 4px 0 rgba(20,12,53,.6); }
  .hook.coral { border-color:var(--coral); box-shadow:0 18px 50px rgba(5,0,25,.65), inset 0 2px 0 rgba(255,255,255,.18), 0 0 46px rgba(255,92,138,.4); }
  .hook.teal { border-color:var(--teal); box-shadow:0 18px 50px rgba(5,0,25,.65), inset 0 2px 0 rgba(255,255,255,.18), 0 0 46px rgba(46,230,214,.35); }
  .hook.small { font-size:62px; }
  em { font-style:normal; color:var(--gold); }
  .tl { color:var(--teal); } .cr { color:var(--coral); } .lv { color:var(--lav); }
  /* bölge etiketi */
  .chip { display:inline-flex; align-items:center; gap:14px; padding:12px 30px 12px 14px; border-radius:999px; font:900 36px/1 var(--ui); letter-spacing:2px; text-transform:uppercase;
    color:var(--cream); background:rgba(16,9,46,.86); border:4px solid var(--teal); box-shadow:0 10px 30px rgba(5,0,25,.55), 0 0 24px rgba(46,230,214,.35); }
  .chip b { display:inline-grid; place-items:center; min-width:62px; height:62px; border-radius:50%; font:800 38px/1 var(--disp); letter-spacing:0;
    background:linear-gradient(180deg,#fff3b0,var(--gold) 55%,var(--gold2)); color:var(--bg0); box-shadow:0 4px 0 rgba(138,69,0,.6); padding-top:4px; }
  .chip.coral { border-color:var(--coral); box-shadow:0 10px 30px rgba(5,0,25,.55), 0 0 24px rgba(255,92,138,.35); }
  .chip.gold { border-color:var(--gold); }
  /* terim: büyük altın kelime + alt satır */
  .term { flex-direction:column; align-items:center; text-align:center; gap:4px; }
  .term .t { font:800 132px/1 var(--disp); letter-spacing:-1px; padding:0 20px;
    background:linear-gradient(180deg, #fff9e0 0%, #ffe27a 38%, #ffc93c 58%, #ff9f1c 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 5px 0 #8a3f00) drop-shadow(0 0 26px rgba(14,8,40,.9)) drop-shadow(0 12px 30px rgba(255,159,28,.35)); }
  .term .t.tlg { background:linear-gradient(180deg, #e9fffc 0%, #7ff3e8 40%, #2ee6d6 65%, #12a89e 100%); -webkit-background-clip:text; background-clip:text; filter:drop-shadow(0 5px 0 #0b5f5a) drop-shadow(0 0 26px rgba(14,8,40,.9)); }
  .term .t.crg { background:linear-gradient(180deg, #ffe3ec 0%, #ff9bb8 40%, #ff5c8a 70%, #d93a6a 100%); -webkit-background-clip:text; background-clip:text; filter:drop-shadow(0 5px 0 #7a1838) drop-shadow(0 0 26px rgba(14,8,40,.9)); }
  .term .s { margin-top:6px; padding:12px 30px; border-radius:28px; font:900 48px/1.15 var(--ui); color:var(--cream); background:rgba(16,9,46,.82); box-shadow:0 10px 30px rgba(5,0,25,.5); }
  .term .s.plain { background:none; box-shadow:none; text-shadow:0 3px 0 rgba(10,5,30,.9), 0 0 18px rgba(10,5,30,.95); }
  /* bilgi kutusu (alt güvenli bölge, sağ düğme sütunundan uzak) */
  .fact { margin:0 130px 0 100px; padding:24px 32px; text-align:center; font:800 46px/1.2 var(--ui); color:var(--cream);
    background:linear-gradient(180deg, rgba(42,27,99,.95), rgba(18,10,50,.95)); border:5px solid var(--teal); border-radius:36px; box-shadow:0 14px 36px rgba(5,0,25,.6), 0 0 26px rgba(46,230,214,.28); }
  .fact.gold { border-color:var(--gold); box-shadow:0 14px 36px rgba(5,0,25,.6), 0 0 26px rgba(255,201,60,.3); }
  .fact.coral { border-color:var(--coral); }
  .fact b { color:var(--gold); } .fact i { font-style:normal; color:var(--teal); }
  .fact .src { display:block; margin-top:8px; font:800 28px/1.2 var(--ui); color:var(--lav); opacity:.9; }
  /* Tüy Dede'nin sesi için altyazı */
  .sub { margin:0 130px 0 100px; padding:16px 28px; text-align:center; font:800 42px/1.24 var(--ui); color:var(--cream); border-radius:26px;
    background:rgba(10,6,32,.8); box-shadow:0 10px 26px rgba(0,0,0,.45); }
  .sub .who { display:block; font:900 26px/1 var(--ui); letter-spacing:3px; text-transform:uppercase; color:var(--teal); margin-bottom:8px; }
  /* ekran görüntüsü kartı */
  .still { position:relative; overflow:hidden; border-radius:46px; border:6px solid var(--gold); background:var(--bg0);
    box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 3px rgba(20,12,53,.9), 0 0 70px rgba(139,107,255,.45); }
  .still.bare { background:none; border:none; box-shadow:none; border-radius:0; filter:drop-shadow(0 24px 40px rgba(0,0,0,.55)) drop-shadow(0 0 50px rgba(255,201,60,.25)); }
  .still.teal { border-color:var(--teal); } .still.coral { border-color:var(--coral); } .still.plain { border-color:rgba(201,193,255,.5); }
  .still img { position:absolute; left:0; top:0; transform-origin:50% 50%; }
  /* liste (tedavi malzemeleri gibi) */
  .pills { display:flex; flex-wrap:wrap; gap:16px 16px; margin:0 110px 0 90px; justify-content:center; }
  .pills span { padding:14px 26px; border-radius:999px; font:900 40px/1 var(--ui); background:rgba(16,9,46,.9); border:4px solid var(--teal); box-shadow:0 8px 24px rgba(0,0,0,.4); }
  .pills span.g { border-color:var(--gold); } .pills span.c { border-color:var(--coral); }
  /* sayaç */
  .count { font:800 230px/1 var(--disp); background:linear-gradient(180deg, #fff9e0 0%, #ffe27a 38%, #ffc93c 58%, #ff9f1c 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 7px 0 #8a3f00) drop-shadow(0 0 30px rgba(14,8,40,.9)); }
  /* yolculuk şeridi */
  .journey { margin:0 90px; height:86px; align-items:center; }
  .journey .track { position:relative; width:100%; height:12px; border-radius:6px; background:rgba(16,9,46,.85); box-shadow:0 0 0 3px rgba(201,193,255,.35); }
  .journey .fill { position:absolute; left:0; top:0; bottom:0; border-radius:6px; background:linear-gradient(90deg, var(--gold), var(--teal)); box-shadow:0 0 18px rgba(46,230,214,.7); }
  .journey .dot { position:absolute; top:50%; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; background:#2a1b63; border:4px solid rgba(201,193,255,.6); }
  .journey .dot.on { background:var(--gold); border-color:#fff3b0; box-shadow:0 0 16px rgba(255,201,60,.9); }
  .journey .odi { position:absolute; top:50%; width:74px; height:74px; margin:-37px 0 0 -37px; }
  /* bitiş kartı */
  .logo { flex-direction:column; align-items:center; gap:4px; }
  .logo .w { font:800 230px/0.9 var(--disp); letter-spacing:4px; padding-top:30px;
    background:linear-gradient(180deg, #fff9e0 0%, #ffe27a 38%, #ffc93c 58%, #ff9f1c 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 8px 0 #b85c00) drop-shadow(0 22px 44px rgba(255,159,28,.4)); }
  .logo .w span { background:linear-gradient(180deg, #e9fffc 0%, #2ee6d6 60%, #12a89e 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .logo .tag { display:flex; align-items:center; gap:26px; font:900 50px/1 var(--ui); letter-spacing:12px; text-transform:uppercase; color:var(--cream); margin-top:10px; }
  .logo .tag i { width:80px; height:5px; border-radius:3px; background:linear-gradient(90deg, transparent, var(--gold)); }
  .logo .tag i:last-child { background:linear-gradient(90deg, var(--gold), transparent); }
  .logo.sm .w { font-size:150px; padding-top:20px; } .logo.sm .tag { font-size:34px; letter-spacing:9px; } .logo.sm .tag i { width:54px; }
  .soon { padding:24px 54px 22px; border-radius:999px; font:800 74px/1 var(--disp); color:var(--bg0);
    background:linear-gradient(180deg,#fff3b0,var(--gold) 55%,var(--gold2)); box-shadow:0 10px 0 rgba(138,69,0,.6), 0 0 60px rgba(255,201,60,.55); }
  .cta { flex-direction:column; align-items:center; gap:18px; text-align:center; }
  .cta .a { font:900 52px/1.15 var(--ui); color:var(--cream); }
  .cta .b { font:900 44px/1.15 var(--ui); color:var(--teal); }
  .note { font:800 30px/1.3 var(--ui); color:var(--lav); text-align:center; margin:0 120px; }

  /* ===== Reklam (TV reklamı tarzı) eklentileri: kinetik yazı, arka planlar, telefon kartı, saat, sızıntı ===== */
  .bg-black { position:absolute; inset:0; background:#000; }
  .bg-void { position:absolute; inset:0; background:radial-gradient(60% 40% at 50% 45%, #1d1240 0%, #07040f 70%, #000 100%); }
  .bg-goo { position:absolute; inset:0; background:radial-gradient(80% 50% at 50% 40%, #ffcf5a 0%, #e89a1c 45%, #7a3d05 100%); }
  .bg-desk { position:absolute; inset:0; background:radial-gradient(55% 32% at 30% 18%, rgba(255,214,140,.38), rgba(255,214,140,0) 70%), linear-gradient(180deg, #0b1030 0%, #070a1f 60%, #04050f 100%); }
  .bg-red { position:absolute; inset:0; background:radial-gradient(70% 45% at 50% 45%, #6b0f22 0%, #2a0510 70%, #0d0206 100%); }
  .bg-stadium { position:absolute; inset:0; background:radial-gradient(90% 40% at 50% 100%, #3a1a7a 0%, #160b38 55%, #07031a 100%); overflow:hidden; }
  .bg-stadium .beam { position:absolute; bottom:-200px; width:260px; height:2600px; transform-origin:50% 100%; background:linear-gradient(0deg, rgba(255,240,200,.0) 0%, rgba(255,240,200,.28) 40%, rgba(255,240,200,0) 100%); filter:blur(18px); }
  .bg-stadium .crowd { position:absolute; left:-40px; right:-40px; bottom:0; height:330px; background:
      radial-gradient(38px 46px at 40px 60px, #05020f 98%, transparent 100%) 0 0/86px 120px repeat-x,
      radial-gradient(40px 50px at 20px 90px, #0a0520 98%, transparent 100%) 30px 70px/92px 130px repeat-x,
      linear-gradient(0deg, #05020f 0 140px, transparent 140px); }
  .bg-stadium .lights { position:absolute; inset:0; background-image:radial-gradient(3px 3px at 10% 70%, #fff 50%, transparent 55%), radial-gradient(3px 3px at 30% 74%, #ffe7a8 50%, transparent 55%), radial-gradient(3px 3px at 52% 69%, #fff 50%, transparent 55%), radial-gradient(3px 3px at 74% 73%, #c9fff9 50%, transparent 55%), radial-gradient(3px 3px at 90% 71%, #fff 50%, transparent 55%); }
  .kt { text-align:center; font:800 150px/0.94 var(--disp); letter-spacing:-1px; text-transform:uppercase; color:#fff; padding:0 40px;
    text-shadow:0 7px 0 rgba(10,5,30,.55), 0 0 40px rgba(10,5,30,.65); }
  .kt.gold { background:linear-gradient(180deg, #fff9e0 0%, #ffe27a 38%, #ffc93c 58%, #ff9f1c 100%); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none; filter:drop-shadow(0 7px 0 #8a3f00) drop-shadow(0 0 30px rgba(14,8,40,.85)); }
  .kt.teal { background:linear-gradient(180deg, #e9fffc 0%, #7ff3e8 40%, #2ee6d6 65%, #12a89e 100%); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none; filter:drop-shadow(0 7px 0 #0b5f5a) drop-shadow(0 0 30px rgba(14,8,40,.85)); }
  .kt.coral, .kt.red { background:linear-gradient(180deg, #ffe3ec 0%, #ff9bb8 35%, #ff5c8a 65%, #d93a6a 100%); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none; filter:drop-shadow(0 7px 0 #7a1838) drop-shadow(0 0 30px rgba(14,8,40,.85)); }
  .kt.amber { background:linear-gradient(180deg, #fff4c9 0%, #ffd36a 35%, #e69a1a 70%, #9c5a06 100%); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none; filter:drop-shadow(0 8px 0 #4a2600) drop-shadow(0 0 34px rgba(40,18,0,.8)); }
  .kt.ink { color:#14082e; text-shadow:none; }
  .kt.box { display:inline-block; padding:18px 44px 8px; background:var(--gold); color:#14082e; border-radius:22px; text-shadow:none; box-shadow:0 14px 0 rgba(90,40,0,.55), 0 20px 50px rgba(0,0,0,.5); }
  .kt.box.coral { background:var(--coral); color:#fff; box-shadow:0 14px 0 rgba(90,10,40,.6), 0 20px 50px rgba(0,0,0,.5); }
  .kt.box.teal { background:var(--teal); color:#062a28; box-shadow:0 14px 0 rgba(5,70,66,.6), 0 20px 50px rgba(0,0,0,.5); }
  .kt.box.white { background:#fff6e5; color:#14082e; box-shadow:0 14px 0 rgba(60,40,90,.6), 0 20px 50px rgba(0,0,0,.5); }
  .kt.sm { font-size:96px; } .kt.md { font-size:120px; } .kt.lg { font-size:190px; } .kt.xl { font-size:260px; } .kt.xxl { font-size:520px; line-height:.86; }
  .kt .lo { text-transform:none; }
  /* fragman başlık kartı: geniş aralıklı, gümüş */
  .tt { text-align:center; font:900 74px/1.15 var(--ui); letter-spacing:16px; text-transform:uppercase; padding:0 60px;
    background:linear-gradient(180deg, #ffffff 0%, #d9d4ef 45%, #8f88b8 55%, #f3f0ff 100%); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 18px rgba(170,150,255,.45)); }
  .tt.gold { background:linear-gradient(180deg, #fff9e0 0%, #ffe27a 45%, #c98a12 55%, #fff1b8 100%); -webkit-background-clip:text; background-clip:text; filter:drop-shadow(0 0 22px rgba(255,180,60,.5)); }
  .tt.sm { font-size:52px; letter-spacing:12px; } .tt.lg { font-size:104px; letter-spacing:20px; }
  .tsub { padding:0 90px; font:900 40px/1.25 var(--ui); letter-spacing:6px; text-transform:uppercase; color:#cfc8f0; text-align:center; text-shadow:0 0 18px rgba(0,0,0,.9); }
  .lbl { position:relative; padding:16px 30px 12px; background:#fff6e5; color:#14082e; border-radius:18px; font:900 46px/1.05 var(--ui); text-transform:uppercase; letter-spacing:1px;
    box-shadow:0 10px 0 rgba(20,8,46,.55), 0 18px 40px rgba(0,0,0,.45); border:5px solid #14082e; }
  .lbl small { display:block; font:800 30px/1.15 var(--ui); text-transform:none; letter-spacing:0; color:#5a3fb0; margin-top:4px; }
  .lbl.coral { background:var(--coral); color:#fff; } .lbl.gold { background:var(--gold); } .lbl.teal { background:var(--teal); }
  .lbl.coral small { color:#ffe3ec; }
  .lbl .arr { position:absolute; width:0; height:0; border:22px solid transparent; }
  .lbl .arr.d { left:50%; bottom:-44px; margin-left:-22px; border-top-color:#14082e; }

  const fmt = (n) => n.toLocaleString('tr-TR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  let g = `<rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" rx="6" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.18)"/>`;
  g += `<rect x="${xOf(-100)}" y="${yOf(1.7)}" width="${xOf(50) - xOf(-100)}" height="${yOf(0.3) - yOf(1.7)}" fill="rgba(95,227,154,.12)" stroke="rgba(142,240,176,.4)" stroke-dasharray="3 3"/>`;
  for (const p of [-400, -300, -200, -100, 0, 100, 200]) g += `<line x1="${xOf(p)}" x2="${xOf(p)}" y1="${y0}" y2="${y1}" stroke="rgba(255,255,255,.1)" stroke-width="${p === 0 ? 1.4 : 1}"/><text x="${xOf(p)}" y="${y1 + 14}" text-anchor="middle">${p}</text>`;
  for (const v of [0, 0.5, 1, 1.5, 2, 2.5, 3].filter((v) => v <= ymax)) g += `<line x1="${x0}" x2="${x1}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="rgba(255,255,255,.08)"/><text x="${x0 - 5}" y="${yOf(v) + 3.5}" text-anchor="end">${fmt(v)}</text>`;
  g += `<text x="${x1}" y="${H - 2}" text-anchor="end" style="font-size:12px">daPa</text><text x="6" y="${y0 + 4}" transform="rotate(-90 6 ${y0 + 4})" text-anchor="end" style="font-size:12px">ml</text>`;
  g += `<path class="crv" pathLength="1" stroke-dasharray="1 1" d="${pts.map(([p, v], i) => `${i ? 'L' : 'M'}${xOf(p).toFixed(1)} ${yOf(v).toFixed(1)}`).join(' ')}" fill="none" stroke="#ffd66b" stroke-width="3.2" stroke-linecap="round"/>`;
  if (values) g += `<text x="${x1 - 6}" y="${y0 + 16}" text-anchor="end" style="font-size:14px;fill:#ffd66b">Kanal hacmi ${fmt(t.hacim)} ml</text>`;
